[project]
name = "eeg-challenge"
version = "0.2.0"
description = "VQ-VAE pretraining pipeline for EEG foundation models, built on braindecode's Labram encoder/decoder for the EEG Foundation Challenge (HBN-EEG via eegdash)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "accelerate==1.10.1",
    "braindecode==1.2.0",
    "eegdash==0.3.8",
    "tensorboard==2.20.0",
    "transformers==4.56.2",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

