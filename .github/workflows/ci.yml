name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Ruff is a pure static analyzer, so it runs in an isolated, ephemeral
      # environment (uvx) instead of syncing the project's heavy ML
      # dependencies (torch, braindecode, eegdash, ...) just to lint.
      - name: Ruff check
        run: uvx ruff@0.16.9 check .

      - name: Ruff format check
        run: uvx ruff@0.16.9 format --check .

  test:
    name: Unit tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      # Installs the pinned CPU/GPU-agnostic dependency set from uv.lock (the
      # actual GPU training image is built separately, see Dockerfile).
      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest --cov=src --cov-report=term-missing
